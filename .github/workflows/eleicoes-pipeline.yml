name: Observatório Eleições 2026 — Pesquisas (TSE)

# Diariamente às 15:05 UTC (~12h05 BRT), escalonado para não colidir com os
# demais pipelines de dados. Também pode ser disparado via workflow_dispatch.
# Fonte: TSE Dados Abertos — Pesquisas Eleitorais 2026 (republicado diariamente).
on:
  schedule:
    - cron: '5 15 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # necessário para o createWorkflowDispatch (build-and-deploy.yml)

jobs:
  collect-pesquisas:
    name: Coleta TSE → gold → JSON
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ingestion_eleicoes/requirements.txt

      - name: Instalar dependências Python
        run: pip install -r ingestion_eleicoes/requirements.txt

      - name: Criar diretórios de dados
        run: mkdir -p data/bronze/eleicoes_pesquisas data/bronze/eleicoes_precandidatos data/bronze/eleicoes_estaduais data/bronze/eleicoes_integridade data/bronze/eleicoes_patrimonio data/bronze/eleicoes_prestacao_contas data/gold

      # Resiliência: o CDN do TSE (cdn.tse.jus.br) às vezes recusa/atrasa
      # conexões de IPs de nuvem (timeout no runner). Antes esse passo era o
      # único sem continue-on-error e derrubava o run inteiro — bloqueando até
      # as seções que NÃO dependem do TSE. Agora degrada sozinho: mantém o
      # eleicoes_pesquisas.json anterior (o frontend já é fail-soft) e deixa as
      # demais seções coletarem, commitarem e deployarem.
      - name: Coletar pesquisas registradas (TSE)
        continue-on-error: true
        run: python ingestion_eleicoes/collect_pesquisas.py

      - name: Gold — agregações do observatório
        continue-on-error: true
        run: python transform_eleicoes/gold_eleicoes.py

      # Fonte é a Wikipedia (layout pode mudar) — não deve derrubar o pipeline
      # diário de pesquisas; a página degrada a seção de intenção sozinha.
      - name: Coletar pré-candidatos + intenção (Wikipedia → agrega TSE)
        continue-on-error: true
        run: python ingestion_eleicoes/collect_precandidatos.py

      - name: Gold — pré-candidatos + intenção presidencial
        continue-on-error: true
        run: python transform_eleicoes/gold_precandidatos.py

      - name: Coletar intenção estadual (Wikipedia por UF → agrega TSE)
        continue-on-error: true
        run: python ingestion_eleicoes/collect_estaduais.py

      - name: Gold — intenção estadual (governador + senador)
        continue-on-error: true
        run: python transform_eleicoes/gold_estaduais.py

      # Situação de registro: roster do painel + TSE Dados Abertos (consulta_cand).
      # O CDN do TSE (cdn.tse.jus.br) recusa conexões de IPs de nuvem com HTTP 403
      # de forma consistente — roda fail-soft e mantém o JSON anterior.
      - name: Coletar situação de registro (roster + TSE Dados Abertos)
        continue-on-error: true
        run: python ingestion_eleicoes/collect_integridade.py

      - name: Gold — situação de registro dos pré-candidatos
        continue-on-error: true
        run: python transform_eleicoes/gold_integridade.py

      # Patrimônio declarado: mesma fonte (TSE Dados Abertos), 2026 vs. 2022 por CPF.
      - name: Coletar patrimônio declarado (TSE Dados Abertos, 2026 + 2022)
        continue-on-error: true
        run: python ingestion_eleicoes/collect_patrimonio.py

      - name: Gold — patrimônio declarado (2022→2026)
        continue-on-error: true
        run: python transform_eleicoes/gold_patrimonio.py

      # Prestação de contas (receitas + despesas): sem dado real até o prazo
      # da prestação parcial (13/09/2026) — até lá roda fail-soft e o JSON sai
      # vazio por definição, não por falha. Fica ligado agora para começar a
      # aparecer sozinho assim que o TSE publicar, sem precisar de novo deploy.
      - name: Coletar prestação de contas (TSE Dados Abertos)
        continue-on-error: true
        run: python ingestion_eleicoes/collect_prestacao_contas.py

      - name: Gold — prestação de contas (receitas + despesas)
        continue-on-error: true
        run: python transform_eleicoes/gold_prestacao_contas.py

      # Deflator IPCA do Fundo Eleitoral (BACEN SGS 433): múltiplo real vs. nominal.
      - name: Gold — deflator IPCA do Fundo Eleitoral
        continue-on-error: true
        run: python transform_eleicoes/gold_fundo_ipca.py

      # Monitor do bloco presidencial por região (curado à mão): valida schema e
      # avisa (não bloqueia) quando o recorte está velho — hora de atualizar à mão.
      - name: Check — frescor + schema do mapa presidencial por região
        continue-on-error: true
        run: python transform_eleicoes/check_regioes_freshness.py

      - name: Commit dados atualizados
        run: |
          git config user.name "eleicoes-pipeline[bot]"
          git config user.email "eleicoes-pipeline@users.noreply.github.com"

          git add data/bronze/eleicoes_pesquisas/ data/bronze/eleicoes_precandidatos/ \
                  data/bronze/eleicoes_estaduais/ data/bronze/eleicoes_integridade/ \
                  data/bronze/eleicoes_patrimonio/ data/bronze/eleicoes_prestacao_contas/ data/gold/ \
                  assets/data/eleicoes_pesquisas.json assets/data/eleicoes_precandidatos.json \
                  assets/data/eleicoes_estaduais.json assets/data/eleicoes_integridade.json \
                  assets/data/eleicoes_fundo_ipca.json assets/data/eleicoes_patrimonio.json \
                  assets/data/eleicoes_prestacao_contas.json || true

          if git diff --staged --quiet; then
            echo "ℹ Sem mudanças nos dados — nada a commitar."
          else
            TODAY=$(date +%Y-%m-%d)
            git commit -m "data: coleta de pesquisas — Observatório Eleições 2026 ${TODAY}"
            # Push resiliente: reconcilia com origin/main preferindo os dados
            # recém-gerados (resolve até parquet binário) e re-tenta.
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                echo "✅ Dados enviados (tentativa ${attempt})."
                break
              fi
              if [ "${attempt}" = "5" ]; then
                echo "✗ Push falhou após 5 tentativas."; exit 1
              fi
              echo "↻ Push rejeitado — reconciliando com origin/main (tentativa ${attempt})."
              git fetch origin main
              git merge -X ours --no-edit FETCH_HEAD || {
                git checkout --ours . && git add -A && GIT_EDITOR=true git commit --no-edit || true
              }
              sleep $(( attempt * 3 ))
            done
          fi

      - name: Disparar deploy do site
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-and-deploy.yml',
              ref: 'main'
            });
            console.log('✅ Deploy disparado.');
